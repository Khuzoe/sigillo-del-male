name: Quality And Derived Data

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Validation And Search Build
        run: npm run qa

      - name: Build Foundry Data (ignored by git)
        run: npm run build:foundry

      - name: Commit generated derived data
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update derived data [skip ci]"
          file_pattern: 'assets/data/search-index.json assets/data/home-recent-npcs.json assets/data/npc-recency.json'

  assets-walls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test authenticated wall detection without paid API calls
        run: npm run test:assets-walls
      - name: Build complete Worker without publishing
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.91.0 deploy --dry-run --config workers/main-worker/wrangler.jsonc --outdir "$RUNNER_TEMP/worker-bundle"
