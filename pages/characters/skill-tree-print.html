<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Alberi abilita - Anteprima PDF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/pages/skill-tree-print.css?v=20260802-skill-tree-pdf1">
</head>
<body class="skill-tree-print-page is-loading">
    <header class="skill-tree-print-controls" data-print-controls>
        <div>
            <span class="skill-tree-print-controls-kicker">Anteprima PDF</span>
            <strong data-print-document-title>Alberi abilita</strong>
            <small data-print-status>Preparazione immagini e font...</small>
        </div>
        <div class="skill-tree-print-controls-actions">
            <button type="button" data-print-close><i class="fas fa-arrow-left" aria-hidden="true"></i> Torna alla scheda</button>
            <button type="button" class="is-primary" data-print-pdf disabled><i class="fas fa-file-arrow-down" aria-hidden="true"></i> Salva come PDF</button>
        </div>
    </header>
    <main class="skill-tree-print-document" data-print-document aria-live="polite">
        <section class="skill-tree-print-loading">
            <i class="fas fa-circle-notch fa-spin" aria-hidden="true"></i>
            <strong>Preparazione del documento</strong>
            <span>Stiamo caricando illustrazioni, icone e caratteri tipografici.</span>
        </section>
    </main>
    <script src="../../assets/js/pages/skill-tree-print.js?v=20260802-skill-tree-pdf1"></script>
</body>
</html>
